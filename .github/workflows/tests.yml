name: Pruebas Automatizadas (Pytest)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ejecutar-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar FFmpeg ligero
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libportaudio2

      - name: Instalar dependencias de Python y pytest
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy sounddevice onvif-zeep flask mysql-connector-python pytest pytest-cov

      - name: Ejecutar batería de 39 tests con cobertura
        run: |
          pytest -v -s --durations=0 --cov=. --cov-report=term-missing

